apiVersion: v2
name: openan-registry-center
description: OpenAN Registry Center packaged as an ODA Component (A2A Agent Card registry)
type: application
version: 0.2.0
# version: 0.1.0 - Initial ODA Component packaging of the Registry Center
# version: 0.1.1 - prepare-runtime runs as root (minimal caps) and chowns data/log to the pod user;
#   persistence.prepareAsRoot=false keeps the non-root init
# version: 0.2.0 - optional TMFC012 alignment: tmf639.* (TMF639 v5 exposed API and hub events),
#   broadcast.* (change broadcast and callback allowlist), catalog.* (optional TMF634 DependentAPI).
#   Breaking: REGISTRY_BROADCAST_* and REGISTRY_TMF639_ENABLED are generated, so registry.extraEnv can no longer set them.
#   REGISTRY_PATH_PREFIX=/<componentName>: the Canvas gateway forwards /<componentName>/... unchanged (needs a
#   registry-center image with path.prefix; older images ignore it and stay unreachable through the gateway).
#   broadcast.callbackCaConfigMap/callbackCaKey: extra CAs for callback TLS (REGISTRY_BROADCAST_CALLBACK_CA_FILE;
#   needs an image with broadcast.callback.ca.file, older images ignore it).
appVersion: "v1"
