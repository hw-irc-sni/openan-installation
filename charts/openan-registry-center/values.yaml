# ODA Component identity (Component name is <release>-<component.name>).
component:
  id: ""               # default OPENAN-RC; TMFC012 when tmf639.enabled
  name: registrycenter
  functionalBlock: ""  # default AIAgentRegistry; Production when tmf639.enabled
  publicationDate: "2026-11-01T00:00:00.000Z"
  version: 0.1.0
  apipolicy:
    apiKeyVerification: {enabled: false, location: header}
    rateLimit: {enabled: false, identifier: IP, limit: "6", interval: pm}
    quota: {identifier: "", limit: ""}
    OASValidation: {requestEnabled: false, responseEnabled: false, allowUnspecifiedHeaders: false, allowUnspecifiedQueryParams: false, allowUnspecifiedCookies: false}
    CORS: {enabled: false, allowCredentials: false, allowOrigins: "", handlePreflightRequests: {enabled: false, allowHeaders: "Accept, Content-Type", allowMethods: "GET, POST", maxAge: 36000}}
    template: ""
security:
  canvasSystemRole: canvasRole

image:
  repository: ghcr.io/project-openan/registry-center
  tag: ""   # REQUIRED: no usable default (see docs/en/TRANSPORT_DEPLOYMENT.md)
  pullPolicy: IfNotPresent
port: 5000
specPort: 8081   # nginx sidecar serving the hand-authored OpenAPI document
replicas: 1   # RC events/schedulers are process-local: keep 1

# Secrets are created by the OpenAN operator (or by hand) and only referenced here.
runtimeSecret: ""      # env INTEGRATION_TOKEN_HMAC_KEY / INTEGRATION_FINGERPRINT_KEY (required)
credentialSecret: ""   # key integration_credentials.conf (required, static_bearer tokens)
# Set by the OpenAN operator to the hash of the credentials file: the file is mounted by subPath and never
# refreshed in a running pod, so a new value restarts it. Empty: no annotation.
credentialsChecksum: ""

registry:
  identityMode: token
  authMode: static_bearer
  publicBaseUrl: ""
  signatureValidation: true
  extraEnv: {}           # non-secret REGISTRY_* settings (e.g. trusted key allowlist)
  modelsYaml: ""         # optional complete models.yaml content; empty -> empty models map

# TMF639 Resource Inventory v5 facade (TMFC012 alignment). Needs a registry-center image with agent_registry/tmf639.
# When false the Component renders exactly as before.
tmf639:
  enabled: false
  # REQUIRED when enabled: release-independent URL of the TMF639 v5 profile, i.e. registry-center
  # docs/openapi/tmf639-a2a-agent-v5.yaml at a pinned tag or commit. Never the canonical TMF OAS URL:
  # the Canvas matches dependencies by exact URL, so that would serve every TMF639 dependency in the cluster.
  specificationUrl: ""

# Native change broadcast (webhook subscriptions and the TMF639 /hub). Events go only to listed hosts.
broadcast:
  enabled: false
  callbackAllowlist: ""   # comma-separated callback hosts; required when enabled
  allowHttpCallbacks: false   # plain-HTTP callbacks (in-cluster listeners without TLS)
  # ConfigMap (same namespace) with a PEM bundle of extra CAs for callback TLS, e.g. for in-cluster
  # listeners with private certificates. Added to the default CAs; verification is never disabled.
  # Read at startup: restart the pod after changing it. Needs an image with broadcast.callback.ca.file.
  callbackCaConfigMap: ""
  callbackCaKey: ca.crt         # key of the bundle in that ConfigMap

# Optional TMF634 Resource Catalog dependency (TMFC012 declares it required). It only declares the
# DependentAPI: the Registry Center does not check cards against a catalog yet. The Canvas ignores
# `required: false` when computing status, so the Component stays InProgress until a catalog
# declaring exactly this URL is deployed.
catalog:
  enabled: false
  specificationUrl: "https://tmf-open-api-table-documents.s3.eu-west-1.amazonaws.com/OpenApiTable/TMF634_Resource_Catalog/5.0.0/swagger/TMF634-Resource_Catalog_Management-v5.0.0.oas.yaml"
persistence:
  size: 5Gi
  storageClassName: ""
  # prepare-runtime runs as root to create data/ and log/ owned by podSecurityContext.runAsUser/runAsGroup
  # (needed on hostPath/local PVs, which ignore fsGroup). false keeps it non-root for Pod Security "restricted";
  # the volume must then be writable for the pod user. Without podSecurityContext.runAsUser it is always non-root.
  prepareAsRoot: true
resources: {}
# Must match the image's user (source builds use 10001; older published images run as 1000).
podSecurityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
# Local verification keys for signed agent cards (alternative to an HTTPS jku + allow-list):
# the named ConfigMap holds <agent>.json = {"keys": [JWK]} and is mounted under .../jwks/<organization>.
trust: {organization: "", configMap: ""}
