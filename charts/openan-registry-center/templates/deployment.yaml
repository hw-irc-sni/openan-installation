apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rc.fullname" . }}
  labels: {{- include "rc.labels" . | nindent 4 }}
spec:
  replicas: {{ int .Values.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: {{ include "rc.fullname" . }}
  template:
    metadata:
      labels: {{- include "rc.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      - name: prepare-runtime
        image: {{ printf "%s:%s" .Values.image.repository (toString .Values.image.tag) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        {{- $psc := .Values.podSecurityContext | default dict }}
        {{- $uidSet := not (kindIs "invalid" $psc.runAsUser) }}
        {{- if and .Values.persistence.prepareAsRoot $uidSet }}
        {{- $uid := int $psc.runAsUser }}
        {{- $gid := $uid }}
        {{- if not (kindIs "invalid" $psc.runAsGroup) }}{{ $gid = int $psc.runAsGroup }}{{ end }}
        {{- if or (le $uid 0) (le $gid 0) }}{{ fail "podSecurityContext.runAsUser/runAsGroup must be positive integers when persistence.prepareAsRoot is true" }}{{ end }}
        # Runs as root: a hostPath/local PV root is typically root:root 0755 and kubelet does not apply fsGroup
        # to it, so the app user cannot create data/ and log/. Root creates them and hands them to the pod's
        # runAsUser/runAsGroup (published images run as 1000, source builds as 10001). If root cannot change
        # ownership (e.g. NFS root_squash), it falls back to creating them as the app user, like the non-root
        # init. Set persistence.prepareAsRoot=false where fsGroup works and Pod Security "restricted" applies.
        command:
        - /bin/sh
        - -c
        - |
          set -e
          # chgrp on the volume root first: if root cannot change ownership, nothing is created as root.
          if chgrp {{ $gid }} /runtime && chmod 1770 /runtime && mkdir -p /runtime/data /runtime/log \
            && chown {{ $uid }}:{{ $gid }} /runtime/data /runtime/log && chmod 0770 /runtime/data /runtime/log; then
            echo "prepare-runtime: data/ and log/ owned by {{ $uid }}:{{ $gid }}"
          else
            echo "prepare-runtime: cannot set ownership as root (e.g. NFS root_squash); creating as {{ $uid }}:{{ $gid }}" >&2
            exec python -c "import os; from pathlib import Path; os.getuid() == 0 and (os.setgroups([]), os.setgid({{ $gid }}), os.setuid({{ $uid }})); ds = [Path('/runtime', p) for p in ('data', 'log')]; [d.mkdir(mode=0o770, exist_ok=True) for d in ds]; [d.chmod(0o770) for d in ds if d.stat().st_uid == os.getuid()]"
          fi
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL], add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]}
        {{- else }}
        # Non-root: relies on the volume being writable for the pod user (e.g. fsGroup applied by the CSI driver).
        command: ["python", "-c", "from pathlib import Path; [Path('/runtime', p).mkdir(mode=0o770, exist_ok=True) for p in ('data', 'log')]"]
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        {{- end }}
        volumeMounts:
        - {name: runtime, mountPath: /runtime}
      containers:
      - name: registry-center
        image: {{ printf "%s:%s" .Values.image.repository (toString .Values.image.tag) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        ports:
        - {name: http, containerPort: {{ int .Values.port }}}
        envFrom:
        - configMapRef: {name: {{ include "rc.fullname" . }}-config}
        - secretRef: {name: {{ .Values.runtimeSecret }}}
        readinessProbe: {exec: {command: ["python", "-m", "agent_registry.healthcheck"]}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 10, failureThreshold: 12}
        livenessProbe: {exec: {command: ["python", "-m", "agent_registry.healthcheck"]}, initialDelaySeconds: 40, periodSeconds: 30, timeoutSeconds: 10}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - {name: runtime, mountPath: /opt/registry-center/data, subPath: data}
        - {name: runtime, mountPath: /opt/registry-center/log, subPath: log}
        - {name: models, mountPath: /opt/registry-center/etc/config/models.yaml, subPath: models.yaml, readOnly: true}
        - {name: credentials, mountPath: /opt/registry-center/etc/conf/integration_credentials.conf, subPath: integration_credentials.conf, readOnly: true}
        {{- if .Values.trust.configMap }}
        # Registry-local verification keys: <org>/<agent>.json, maintained by the OpenAN operator.
        # Whole-directory mount (no subPath) so ConfigMap updates reach the pod without a restart.
        - {name: trust, mountPath: "/opt/registry-center/etc/sign_verify/jwks/{{ required "trust.organization is required" .Values.trust.organization }}", readOnly: true}
        {{- end }}
        {{- if .Values.broadcast.callbackCaConfigMap }}
        # Extra CAs for callback TLS (REGISTRY_BROADCAST_CALLBACK_CA_FILE), read at startup.
        - {name: callback-ca, mountPath: /opt/registry-center/etc/callback-ca, readOnly: true}
        {{- end }}
      - name: spec
        # Serves the hand-authored OpenAPI document; reuses the service image (python is always present).
        image: {{ printf "%s:%s" .Values.image.repository (toString .Values.image.tag) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        command: ["python", "-m", "http.server", {{ int .Values.specPort | toString | quote }}, "--directory", "/spec"]
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        ports:
        - {name: spec, containerPort: {{ int .Values.specPort }}}
        volumeMounts:
        - {name: openapi, mountPath: /spec, readOnly: true}
        resources: {requests: {cpu: 5m, memory: 16Mi}}
      volumes:
      - name: runtime
        persistentVolumeClaim: {claimName: {{ include "rc.fullname" . }}-runtime}
      - name: models
        configMap: {name: {{ include "rc.fullname" . }}-models}
      - name: openapi
        configMap: {name: {{ include "rc.fullname" . }}-openapi}
      - name: credentials
        secret: {secretName: {{ .Values.credentialSecret }}, defaultMode: 0440}
      {{- if .Values.trust.configMap }}
      - name: trust
        configMap: {name: {{ .Values.trust.configMap }}, optional: true}
      {{- end }}
      {{- if .Values.broadcast.callbackCaConfigMap }}
      - name: callback-ca
        # Not optional: a missing bundle keeps the pod from starting instead of weakening callback TLS.
        configMap:
          name: {{ .Values.broadcast.callbackCaConfigMap | quote }}
          items: [{key: {{ .Values.broadcast.callbackCaKey | quote }}, path: ca.pem}]
      {{- end }}
