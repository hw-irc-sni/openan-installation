apiVersion: v1
kind: Service
metadata:
  name: {{ include "rc.fullname" . }}
  labels: {{- include "rc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "rc.fullname" . }}
  ports:
  - {name: http, port: {{ int .Values.port }}, targetPort: {{ int .Values.port }}, protocol: TCP}
  - {name: spec, port: {{ int .Values.specPort }}, targetPort: spec, protocol: TCP}
