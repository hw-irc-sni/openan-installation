apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openan-operator.fullname" . }}-configmap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openan-operator.labels" . | nindent 4 }}
data:
  LOGGING: {{ .Values.configmap.loglevel | quote }}
  {{- range $k, $v := .Values.configmap.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
