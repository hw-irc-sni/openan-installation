# Optional private registry prefix (include trailing /) and pull secrets,
# same convention as the ODA Canvas charts.
global:
  image:
    registry: ""
  imagePullSecrets: []

deployment:
  # Used as Deployment name, container name and `app` label.
  # The canvas-portal-v2 Operators page matches on this name (see README).
  operatorName: openan-operator
  image: openan/openan-operator
  version: 0.1.0
  prereleaseSuffix: ""
  imagePullPolicy: IfNotPresent
  replicas: 1
  # Comma separated list of namespaces the operator watches (kopf `-n` flags)
  monitoredNamespaces: "components,odacompns-*"
  # Entrypoint of the image. Defaults to a kopf operator.
  command: ["/bin/sh", "-c"]
  args: "cd /app && exec kopf run --standalone {{ include \"openan-operator.monitoredNamespacesCLIOpts\" . }} --verbose -m src.openan_operator"

# Optional TM Forum operator identity, shown as a badge on the portal.
tmf:
  operatorId: "TMFOP000"        # not an official TM Forum operator id
  operatorName: "OpenAN Operator"      # e.g. OpenAN Operator

# Environment variables for the operator (rendered into a ConfigMap)
configmap:
  loglevel: "20"
  extra: {}             # e.g. METRICS_PORT: "8000", REGISTRY_URL_OVERRIDE: "http://..."
  # Agent sync (spec.agentSync.enabled on the OpenAN CR), all optional:
  #   AGENT_PROXY_IMAGE: "nginxinc/nginx-unprivileged:1.27-alpine"   # mirror proxy, pinned tag
  #   AGENT_UPSTREAM_ALLOWED_HOSTS: ".example.com"                     # only these mirror targets
  #   AGENT_DEPLOY_REGISTRIES: "partner=http://partner.components.svc.cluster.local:8080"  # registries whose cards may run images
  #   AGENT_SYNC_RESYNC_SECONDS: "300"                                 # full list at least this often
  #   AGENT_SYNC_TMF639_SECONDS: "60"                                  # poll interval of TMF639-only registries

# A2A routes in agentgateway (standalone, config file in a ConfigMap): one route per a2a ExposedAPI of every
# namespace with a Ready OpenAN CR (spec.agentGateway.enabled, default true), path <pathPrefix>/<namespace>/<ExposedAPI>.
# The operator writes only routes named openan.<namespace>.* in the ConfigMap's config.yaml and reads the reload
# status on port 8081 with the key in keySecret. Renders the AGENTGATEWAY_* settings and a Role in `namespace`
# limited to that ConfigMap and Secret.
agentGateway:
  enabled: false
  namespace: canvas
  configMap: agentgateway-config
  keySecret: agentgateway-portal-key
  configUrl: ""          # default http://agentgateway.<namespace>.svc.cluster.local:8081
  gateway: default       # `gateways:` of the routes (the agentgateway chart's listener)
  pathPrefix: /agents
  # Base URL of the gateway's traffic port (e.g. http://agentgateway.canvas.svc.cluster.local). Empty (default): cards
  # published to registries keep the agent's own URL. Set: they advertise the agent's gateway route instead.
  publishUrl: ""

serviceAccount:
  create: true
  name: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

extraEnvVars: []
