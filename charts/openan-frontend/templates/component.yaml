{{- if not .Values.image.tag }}{{ fail "image.tag is required" }}{{- end }}
{{- if not .Values.backendUrl }}{{ fail "backendUrl is required" }}{{- end }}
{{- if not .Values.registryUrl }}{{ fail "registryUrl is required" }}{{- end }}
apiVersion: oda.tmforum.org/v1
kind: Component
metadata:
  name: {{ include "fe.componentName" . }}
  labels:
    oda.tmforum.org/componentName: {{ include "fe.componentName" . }}
spec:
  componentMetadata:
    id: {{ .Values.component.id }}
    name: {{ .Values.component.name }}
    functionalBlock: {{ .Values.component.functionalBlock }}
    publicationDate: {{ .Values.component.publicationDate | quote }}
    status: specified
    version: {{ .Values.component.version }}
    description: "OpenAN portal: web UI for the Registry Center and Orchestration Center."
    maintainers:
    - name: OpenAN
      email: openan@example.invalid
    owners:
    - name: OpenAN
      email: openan@example.invalid
  coreFunction:
    exposedAPIs: []
    dependentAPIs: []
  eventNotification:
    publishedEvents: []
    subscribedEvents: []
  managementFunction:
    exposedAPIs: []
  securityFunction:
    canvasSystemRole: {{ .Values.security.canvasSystemRole | quote }}
    exposedAPIs: []
