apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fe.fullname" . }}
  labels: {{- include "fe.labels" . | nindent 4 }}
spec:
  replicas: {{ int .Values.replicas }}
  selector:
    matchLabels:
      app: {{ include "fe.fullname" . }}
  template:
    metadata:
      labels: {{- include "fe.labels" . | nindent 8 }}
    spec:
      containers:
      - name: frontend
        image: {{ printf "%s:%s" .Values.image.repository (toString .Values.image.tag) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        ports:
        - {name: http, containerPort: {{ int .Values.port }}}
        env:
        - {name: BACKEND_URL, value: {{ .Values.backendUrl | quote }}}
        - {name: REGISTRY_URL, value: {{ .Values.registryUrl | quote }}}
        readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /, port: http}, periodSeconds: 20, initialDelaySeconds: 10}
        resources: {{- toYaml .Values.resources | nindent 10 }}
