apiVersion: v1
kind: Service
metadata:
  name: {{ include "fe.fullname" . }}
  labels: {{- include "fe.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "fe.fullname" . }}
  ports:
  - {name: http, port: {{ .Values.port }}, targetPort: http, protocol: TCP}
