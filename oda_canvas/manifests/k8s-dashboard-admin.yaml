# Login account of the Kubernetes Dashboard (`make k8s-dashboard`): cluster-admin, for this local kind demo only.
# No long-lived token Secret: `make k8s-dashboard-token` issues a short-lived one (K8S_DASHBOARD_TOKEN_DURATION).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-admin
  namespace: kubernetes-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dashboard-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: dashboard-admin
    namespace: kubernetes-dashboard
