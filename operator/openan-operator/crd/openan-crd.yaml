apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openans.openan.dev
spec:
  group: openan.dev
  scope: Namespaced
  names: {kind: OpenAN, listKind: OpenANList, plural: openans, singular: openan, shortNames: [openan]}
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources: {status: {}}
    additionalPrinterColumns:
    - {name: Ready, type: string, jsonPath: ".status.conditions[?(@.type=='Ready')].status"}
    - {name: Age, type: date, jsonPath: ".metadata.creationTimestamp"}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              registryCenter: &component
                type: object
                properties:
                  enabled: {type: boolean, default: true}
                  values:
                    type: object
                    description: Helm values for the component chart. image.tag is required.
                    x-kubernetes-preserve-unknown-fields: true
              orchestrationCenter: *component
              frontend: *component
              registry:
                type: object
                properties:
                  organization: {type: string, default: openan}
              cardSync:
                type: object
                properties:
                  enabled: {type: boolean, default: true}
                  signing:
                    type: object
                    properties:
                      enabled: {type: boolean, default: true}
                      jku: {type: string, description: "HTTPS JWKS URL (host must be in the Registry jwk_allowlist)"}
              agentSync:
                type: object
                description: >-
                  Two-way sync between agent registries (Resource Inventory ODA Components in this namespace) and
                  Agent ODA Components. Adds a read-only registry credential and restarts the Registry Center once.
                properties:
                  enabled: {type: boolean, default: false}
              agentGateway:
                type: object
                description: >-
                  A2A routes in agentgateway for every a2a ExposedAPI of this namespace. Only acts when the operator
                  is configured with a gateway (chart value agentGateway.enabled); this switch turns it off per CR.
                properties:
                  enabled: {type: boolean, default: true}
              retainData: {type: boolean, default: false}
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
