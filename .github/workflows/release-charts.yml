name: Release charts
# Publishes every chart under charts/ as a Helm repository on the gh-pages branch (GitHub Pages):
#   helm repo add openan https://<owner>.github.io/<repo>
# A chart is released only when its Chart.yaml `version` is new; unchanged versions are skipped.
on:
  push:
    branches: [main]
    paths: ['charts/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-charts
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Ensure the gh-pages branch exists
        # chart-releaser publishes index.yaml to gh-pages and fails ("invalid reference: origin/gh-pages") if the
        # branch is missing: create it (empty, orphan) on the first run.
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --no-tags --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          else
            git switch --orphan gh-pages
            touch .nojekyll
            git add .nojekyll
            git commit -q -m "Initialize gh-pages for the Helm repository"
            git push origin gh-pages
            git switch --detach "$GITHUB_SHA"
          fi
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.19.0
      - uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
